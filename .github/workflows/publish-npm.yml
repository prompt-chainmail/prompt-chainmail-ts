name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No registry-url: setup-node would inject a fake NODE_AUTH_TOKEN
          # placeholder and break OIDC trusted publishing.

      # npm stage requires CLI >= 11.19; Node 24 may ship older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned classifier model
        run: npm run fetch:classifier

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      # Dual-use packages cannot direct-publish via OIDC.
      # Stage here, then approve locally with 2FA:
      #   npm stage list
      #   npm stage approve <stage-id> --otp=XXXXXX
      - name: Stage publish to npm
        run: npm stage publish --access public
