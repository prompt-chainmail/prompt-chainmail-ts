name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update benchmark baseline
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'update-benchmark-baseline')
        run: |
          npm run benchmark:baseline:ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/baselines/rivets.json
          if git diff --staged --quiet; then
            echo "Baseline unchanged"
          else
            git commit -m "chore: update benchmark baseline"
            git push
          fi

      - name: Run benchmark gate
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'update-benchmark-baseline')
        run: npm run benchmark:ci
